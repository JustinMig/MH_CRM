name: CRM Regression Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Run every unit and regression test
        run: npm test
      - name: Check every JavaScript file
        run: node scripts/check-syntax.mjs
      - name: Build optimized site
        run: npm run build
      - name: Install isolated browser test tools
        run: npm install --prefix /tmp/mig-browser --ignore-scripts --no-audit --no-fund playwright@1.55.0
      - name: Test call identity, recovery, layout and authenticated startup with synthetic data
        run: NODE_PATH=/tmp/mig-browser/node_modules node tests/browser-regressions.cjs
      - name: Test Height and Weight carrier lookup, reset and stale responses
        run: NODE_PATH=/tmp/mig-browser/node_modules node tests/build-chart-browser.cjs
      - name: Preserve synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mig-regression-results
          path: test-results/
          retention-days: 7
